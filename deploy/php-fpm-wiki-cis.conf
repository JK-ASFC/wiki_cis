; CIS Wiki — pool PHP-FPM isolé pour l'unique script api/feedback.php (Debian 12, PHP 8.2)
; Copier dans /etc/php/8.2/fpm/pool.d/wiki-cis.conf puis : sudo systemctl restart php8.2-fpm
;
; Principe : le script tourne sous un utilisateur dédié sans droits (wikicis), ne voit que
; les dossiers nécessaires, ne peut lancer aucune commande système et dispose de peu de ressources.

[wiki-cis]
user = wikicis
group = wikicis

; nginx (www-data) est le seul à pouvoir parler à ce pool
listen = /run/php/wiki-cis.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Peu de processus, lancés à la demande : un pic d'envois ne peut pas saturer le serveur
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 30s
pm.max_requests = 200
request_terminate_timeout = 30s

; Seuls les fichiers .php sont exécutables
security.limit_extensions = .php

; Variables d'environnement minimales
clear_env = yes

; ---- Durcissement PHP (non modifiable par le script) --------------------
; Accès disque limité : le script, ses réglages, PHPMailer et le dossier temporaire
php_admin_value[open_basedir] = /var/www/wiki-cis/api/:/etc/wiki-cis/:/usr/share/php/:/tmp/
; Aucune exécution de commande système, aucun envoi par mail() (on passe par SMTP)
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,mail,putenv,dl,symlink,link,chmod,chown,chgrp
; Pas d'inclusion ni d'ouverture de fichiers distants, pas d'envoi de fichiers
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[file_uploads] = off
; Petites limites : un avis fait quelques Ko
php_admin_value[post_max_size] = 64K
php_admin_value[memory_limit] = 32M
php_admin_value[max_execution_time] = 20
php_admin_value[max_input_time] = 10
; Pas d'affichage d'erreurs aux visiteurs, mais journalisation
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/wiki-cis/php-error.log
; Pas de session ni de cookie
php_admin_value[session.use_cookies] = 0
