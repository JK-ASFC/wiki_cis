# CIS Wiki — site nginx pour Debian 12 (nginx + php8.2-fpm)
# Copier dans /etc/nginx/sites-available/wiki-cis puis :
#   sudo ln -s /etc/nginx/sites-available/wiki-cis /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Remplacer wiki-cis.exemple.fr par le vrai nom de domaine.

# Limite d'envoi du formulaire : 6 requêtes par minute et par adresse IP (en plus de la limite PHP).
limit_req_zone $binary_remote_addr zone=wikicis_feedback:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name wiki-cis.exemple.fr;

    root /var/www/wiki-cis;
    index index.html;
    charset utf-8;

    # Ne pas annoncer les versions de nginx et de PHP
    server_tokens off;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cis.worldskills-france.org; media-src 'self' https://cis.worldskills-france.org; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Fichiers cachés (.git, .gitignore…) et dossiers internes : jamais servis
    location ~ /\. { deny all; }
    location ~ ^/(config|deploy|docs|tests|tools)/ { deny all; }
    # Prototype d'administration et vue d'ensemble interne : jamais publiés
    location ~ ^/(admin|apercu)\.html$ { deny all; }

    # Seul script PHP autorisé : l'envoi du formulaire « Votre avis ».
    # Chemin fixé en dur (pas de PATH_INFO) : écarte les failles de type CVE-2019-11043.
    location = /api/feedback.php {
        limit_except POST { deny all; }
        limit_req zone=wikicis_feedback burst=3 nodelay;
        client_max_body_size 32k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/feedback.php;
        fastcgi_param PATH_INFO "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/wiki-cis.sock;   # pool isolé (deploy/php-fpm-wiki-cis.conf)
    }
    # Tout autre fichier PHP est refusé
    location ~ \.php$ { deny all; }

    # Pages et fichiers statiques
    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(png|jpg|svg|ico|xlsx|pdf)$ { expires 7d; }
    location ~* \.(css|js)$ { expires 1d; }
}
