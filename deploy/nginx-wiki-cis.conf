# CIS Wiki — site nginx pour Debian 12 (nginx + php8.2-fpm)
# Copier dans /etc/nginx/sites-available/wiki-cis puis :
#   sudo ln -s /etc/nginx/sites-available/wiki-cis /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Remplacer wiki-cis.exemple.fr par le vrai nom de domaine.

# Limite d'envoi du formulaire : 6 requêtes par minute et par adresse IP (en plus de la limite PHP).
limit_req_zone $binary_remote_addr zone=wikicis_feedback:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name wiki-cis.exemple.fr;

    root /var/www/wiki-cis;
    index index.html;
    charset utf-8;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Fichiers cachés (.git, .gitignore…) et dossiers internes : jamais servis
    location ~ /\. { deny all; }
    location ~ ^/(config|deploy|docs|tests|tools)/ { deny all; }

    # Seul script PHP autorisé : l'envoi du formulaire « Votre avis »
    location = /api/feedback.php {
        limit_req zone=wikicis_feedback burst=3 nodelay;
        client_max_body_size 32k;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
    # Tout autre fichier PHP est refusé
    location ~ \.php$ { deny all; }

    # Pages et fichiers statiques
    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(png|jpg|svg|ico|xlsx|pdf)$ { expires 7d; }
    location ~* \.(css|js)$ { expires 1d; }
}
