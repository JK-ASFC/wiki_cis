# Durcissement Apache 2 de cis.worldskills-france.org — correctifs de l'audit du 23/11/2026
#
# Corrige :
#   [ÉLEVÉ]  listes de fichiers visibles (/signoff/config/, /signoff/includes/, /signoff/css/, /signoff/js/…)
#   [ÉLEVÉ]  fichiers PHP internes de l'outil de signature joignables directement (config/, includes/)
#   [ÉLEVÉ]  cookie de session de l'outil de signature (PHPSESSID) sans Secure / HttpOnly / SameSite
#   [MOYEN]  cookie de session du CIS (JSESSIONID) sans HttpOnly / SameSite
#   [MOYEN]  pages sans protection contre le « clickjacking » (portail, /cis2/, /signoff, /wiki)
#   [FAIBLE] version de Jetty annoncée par le CIS
#
# Installation (réversible, n'arrête aucun service) :
#   sudo cp deploy/apache-durcissement-global.conf /etc/apache2/conf-available/durcissement-cis.conf
#   sudo a2enmod headers
#   sudo a2enconf durcissement-cis
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# Retour arrière : sudo a2disconf durcissement-cis && sudo systemctl reload apache2

# ---------------------------------------------------------------------------
# 1. Plus jamais de liste de fichiers, nulle part sous /var/www
#    (Debian active « Options Indexes » par défaut sur /var/www)
# ---------------------------------------------------------------------------
<Directory /var/www/>
    Options -Indexes
</Directory>

# Fichiers cachés et fichiers de sauvegarde : jamais servis (sauf /.well-known/ pour Let's Encrypt)
<DirectoryMatch "/\.(?!well-known)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.(?!well-known)|~$|\.(bak|old|orig|save|swp|sql|log|ini|sh)$)">
    Require all denied
</FilesMatch>

# ---------------------------------------------------------------------------
# 2. Outil de signature (/signoff) : dossiers internes et cookie de session
# ---------------------------------------------------------------------------
# config/ et includes/ ne contiennent que des fichiers inclus par le code PHP :
# PHP les lit sur le disque, le navigateur n'a pas à y accéder.
<DirectoryMatch "^/var/www/signoff/(config|includes)(/|$)">
    Require all denied
</DirectoryMatch>

# Cookie de session PHP sécurisé (si l'outil tourne avec mod_php)
<IfModule php_module>
    <Directory /var/www/signoff>
        php_admin_flag session.cookie_secure on
        php_admin_flag session.cookie_httponly on
        php_admin_value session.cookie_samesite Lax
        php_admin_flag session.use_strict_mode on
        php_admin_flag session.use_only_cookies on
        php_admin_flag display_errors off
    </Directory>
</IfModule>

# ---------------------------------------------------------------------------
# 3. Cookies de session (PHP et CIS/Jetty) : ajout des attributs manquants
#    sans les doubler s'ils sont déjà présents. S'applique aussi aux réponses
#    du CIS transmises par Apache.
# ---------------------------------------------------------------------------
Header edit* Set-Cookie "^((?:PHPSESSID|JSESSIONID|DokuWiki)=(?!.*;\s*[Hh]ttp[Oo]nly).*)$" "$1; HttpOnly"
Header edit* Set-Cookie "^((?:PHPSESSID|JSESSIONID|DokuWiki)=(?!.*;\s*[Ss]ecure).*)$" "$1; Secure"
Header edit* Set-Cookie "^((?:PHPSESSID|JSESSIONID|DokuWiki)=(?!.*;\s*[Ss]ame[Ss]ite).*)$" "$1; SameSite=Lax"
Header always edit* Set-Cookie "^((?:PHPSESSID|JSESSIONID|DokuWiki)=(?!.*;\s*[Hh]ttp[Oo]nly).*)$" "$1; HttpOnly"
Header always edit* Set-Cookie "^((?:PHPSESSID|JSESSIONID|DokuWiki)=(?!.*;\s*[Ss]ecure).*)$" "$1; Secure"
Header always edit* Set-Cookie "^((?:PHPSESSID|JSESSIONID|DokuWiki)=(?!.*;\s*[Ss]ame[Ss]ite).*)$" "$1; SameSite=Lax"

# ---------------------------------------------------------------------------
# 4. En-têtes de sécurité pour tout le site (sans écraser ceux déjà posés,
#    par exemple par le CIS ou par /wiki-cis)
# ---------------------------------------------------------------------------
Header always set X-Frame-Options "SAMEORIGIN" "expr=-z resp('X-Frame-Options')"
Header always set Referrer-Policy "strict-origin-when-cross-origin" "expr=-z resp('Referrer-Policy')"
Header always set X-Content-Type-Options "nosniff" "expr=-z resp('X-Content-Type-Options')"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()" "expr=-z resp('Permissions-Policy')"

# ---------------------------------------------------------------------------
# 5. Ne pas annoncer les versions (Apache, PHP, Jetty)
# ---------------------------------------------------------------------------
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Header always unset X-Powered-By
Header unset X-Powered-By
# Version de Jetty renvoyée par le CIS : on la remplace par une valeur neutre
Header edit Server "^Jetty.*$" "CIS"
