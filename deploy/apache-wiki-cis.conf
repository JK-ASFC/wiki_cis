# CIS Wiki — configuration Apache 2 (Debian 12) pour servir le wiki sous /wiki-cis
#
# Conçue pour un serveur qui sert DÉJÀ d'autres sites (par exemple l'ancien DokuWiki sous /wiki) :
# toutes les règles ci-dessous ne s'appliquent qu'au dossier /var/www/wiki-cis.
# Rien n'est modifié pour /wiki ni pour le reste du serveur (mod_php peut rester actif pour DokuWiki).
#
# Installation :
#   sudo cp /var/www/wiki-cis/deploy/apache-wiki-cis.conf /etc/apache2/conf-available/wiki-cis.conf
#   sudo a2enmod proxy_fcgi headers alias
#   sudo a2enconf wiki-cis
#   sudo apache2ctl configtest && sudo systemctl reload apache2

# Adresse /wiki-cis/ -> dossier /var/www/wiki-cis/
# (inutile si le DocumentRoot du site est déjà /var/www, mais sans danger)
Alias /wiki-cis /var/www/wiki-cis
RedirectMatch 301 ^/wiki-cis$ /wiki-cis/

<Directory /var/www/wiki-cis>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    # Bloque les adresses du type feedback.php/x.php (pas de PATH_INFO)
    AcceptPathInfo Off
    # Requêtes de 32 Ko maximum pour les fichiers statiques
    LimitRequestBody 32768

    # En-têtes de sécurité (uniquement pour le wiki CIS)
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cis.worldskills-france.org; media-src 'self' https://cis.worldskills-france.org; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
    Header always unset X-Powered-By

    # Aucun fichier PHP n'est exécuté dans ce dossier…
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
    # …sauf le formulaire « Votre avis », en POST uniquement, via le pool PHP-FPM isolé
    <Files "feedback.php">
        <RequireAll>
            Require all granted
            Require method POST
        </RequireAll>
        SetHandler "proxy:unix:/run/php/wiki-cis.sock|fcgi://wiki-cis"
        # Envoi de plus de 32 Ko refusé avant d'atteindre PHP
        # (LimitRequestBody ne s'applique pas aux requêtes transmises à PHP-FPM)
        <If "%{HTTP:Content-Length} -gt 32768 || %{HTTP:Transfer-Encoding} =~ /chunked/i">
            Require all denied
        </If>
    </Files>

    # Fichiers internes jamais servis : fichiers cachés (.git, .gitignore…), documentation, scripts
    <FilesMatch "(^\.|\.(md|py|sh|example\.php)$)">
        Require all denied
    </FilesMatch>

    # Cache navigateur
    <FilesMatch "\.(png|jpe?g|svg|ico|xlsx|pdf)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>
    <FilesMatch "\.(css|js)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</Directory>

# Dossiers internes du dépôt : jamais servis
<DirectoryMatch "^/var/www/wiki-cis/(\.git|config|deploy|docs|tests|tools)(/|$)">
    Require all denied
</DirectoryMatch>
